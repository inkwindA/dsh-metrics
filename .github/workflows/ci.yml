name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in index.js client.js store.js http.js import.js test/smoke.mjs; do
            node --check "$file"
          done

      - name: Validate package and locale JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json','utf8'))"

      - name: Run store and import smoke test
        run: node test/smoke.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the Python SDK and example
        run: |
          python -m py_compile python/dsh_metrics.py
          python -m py_compile examples/simulated_training.py
